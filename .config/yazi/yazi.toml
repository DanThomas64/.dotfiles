[manager]
show_hidden=true

[opener]
edit = [
    { run = 'nvim "$@"', block = true, for = "unix" },
    { run = "nvim %*",   block = true, for = "windows" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
# Multiple openers for a single rule
    { name = "*.html", use = [ "open", "edit" ] },
]
